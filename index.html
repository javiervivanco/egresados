<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Montserrat se carga via @import en src/index.css (una sola vez) -->
    <script>
      // Aplica el tema antes del primer render para evitar FOUC. Skeleton activa
      // cada tema con [data-theme='X'] en <html> — necesitamos que matchee desde
      // el primer paint para que nuestros aliases en :root resuelvan colores.
      (function () {
        try {
          var KEY = 'egresados_theme';
          var saved = localStorage.getItem(KEY);
          var THEMES = ['cerberus', 'vox', 'mona', 'rose', 'pine'];
          var name = saved && THEMES.indexOf(saved) >= 0 ? saved : 'cerberus';
          document.documentElement.setAttribute('data-theme', name);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'cerberus');
        }
      })();
    </script>
    <title>Viajes de egresados · Comparativa 2026</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
